services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${RAGBENCH_VERSION:-dev}
    image: rag-benchmark-lab:${RAGBENCH_VERSION:-dev}
    init: true
    restart: unless-stopped
    ports:
      - "${RAGBENCH_PORT:-8000}:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      RAGBENCH_QDRANT_PATH: /data/qdrant
      RAGBENCH_EXPERIMENT_DB_PATH: /data/experiments.sqlite3
    volumes:
      - ragbench-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ragbench-data:
    name: ragbench-data
