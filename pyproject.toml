[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark-lab"
version = "0.2.0"
description = "A reproducible lab for benchmarking retrieval-augmented generation systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohan Gandhi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "openai>=1.66,<3",
  "pypdf>=5.3,<7",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.13,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragbench = ["static/*.html", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
