name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=ragbench --cov-report=term-missing
      - name: Enforce retrieval quality baseline
        run: >-
          ragbench evaluate --name ci-quality-gate --k 3
          --min-mrr 1.0 --min-recall 1.0 --min-hit-rate 1.0
          --max-latency-ms 100
        env:
          RAGBENCH_STORE_BACKEND: memory
          RAGBENCH_RETRIEVAL_MODE: hybrid
          RAGBENCH_EXPERIMENT_DB_PATH: ":memory:"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/ragbench-wheel-test
      - run: /tmp/ragbench-wheel-test/bin/pip install dist/*.whl
      - run: /tmp/ragbench-wheel-test/bin/ragbench doctor
      - name: Verify packaged dashboard assets
        run: >-
          /tmp/ragbench-wheel-test/bin/python -c
          "from importlib.resources import files;
          assert files('ragbench').joinpath('static/health.js').is_file()"
