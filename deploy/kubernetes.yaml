apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragbench-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-benchmark-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-benchmark-lab
  template:
    metadata:
      labels:
        app: rag-benchmark-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-me/rag-benchmark-lab:0.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RAGBENCH_QDRANT_PATH
              value: /data/qdrant
            - name: RAGBENCH_EXPERIMENT_DB_PATH
              value: /data/experiments.sqlite3
            - name: RAGBENCH_RETRIEVAL_MODE
              value: hybrid
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ragbench-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rag-benchmark-lab
spec:
  selector:
    app: rag-benchmark-lab
  ports:
    - name: http
      port: 80
      targetPort: http
